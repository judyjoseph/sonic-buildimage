# Zero-downtime kdump note:
# With the in-tree sonic_kdump_runtime driver (CONFIG_SONIC_KDUMP_RUNTIME=y),
# crash-kernel memory is carved on the running kernel at runtime via
# `config kdump arm-now` (no reboot). A `crashkernel=` boot parameter is NOT
# required here and is intentionally omitted from the cmdline above.
